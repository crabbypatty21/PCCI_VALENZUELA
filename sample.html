<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Applicants</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .login-container, .dashboard-container {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
    .applicant-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      background-color: #fafafa;
    }
    .applicant-card h3 {
      margin-top: 0;
      color: #4CAF50;
    }
    .applicant-section {
      margin-bottom: 8px;
    }
    .applicant-section strong {
      display: inline-block;
      width: 200px;
    }
  </style>
</head>
<body>

<div class="login-container" id="login-container">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <button onclick="login()">Login</button>
  <div class="error" id="error"></div>
</div>

<div class="dashboard-container" id="dashboard-container" style="display:none;">
  <h2>Applicants</h2>
  <div id="applicants-list">
    <!-- Applicant cards will appear here -->
  </div>
</div>

<script>
  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error');
    errorDiv.textContent = '';

    try {
      const response = await fetch('https://pcci-laravel-api.onrender.com/api/login', 
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem('token', data.token);
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('dashboard-container').style.display = 'block';
        fetchApplicants(data.token);
      } else {
        errorDiv.textContent = data.message || 'Login failed. Check credentials.';
      }
    } catch (err) {
      console.error(err);
      errorDiv.textContent = 'An error occurred. Please try again.';
    }
  }

  async function fetchApplicants(token) {
    try {
      const response = await fetch('https://pcci-laravel-api.onrender.com/api/v1/applicants', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      const data = await response.json();

      if (response.ok) {
        const container = document.getElementById('applicants-list');
        container.innerHTML = '';

        data.data.forEach(applicant => {
          const card = document.createElement('div');
          card.className = 'applicant-card';

          card.innerHTML = `
            <h3>Applicant ID: ${applicant.id} - Status: ${applicant.status}</h3>

            <div class="applicant-section"><strong>Date Submitted:</strong> ${applicant.date_submitted}</div>
            <div class="applicant-section"><strong>Date Approved:</strong> ${applicant.date_approved || 'N/A'}</div>
            <div class="applicant-section"><strong>Membership Type:</strong> ${applicant.membership_type || 'N/A'}</div>

            <h4>Basic Profile</h4>
            <div class="applicant-section"><strong>Registered Business Name:</strong> ${applicant.basic_profile.registered_business_name}</div>
            <div class="applicant-section"><strong>Trade Name:</strong> ${applicant.basic_profile.trade_name}</div>
            <div class="applicant-section"><strong>Email:</strong> ${applicant.basic_profile.email}</div>
            <div class="applicant-section"><strong>Phone:</strong> ${applicant.basic_profile.telephone_no}</div>
            <div class="applicant-section"><strong>Website:</strong> ${applicant.basic_profile.website}</div>

            <h4>Business Location</h4>
            <div class="applicant-section"><strong>Address:</strong> ${applicant.basic_profile.business_location.business_address}</div>
            <div class="applicant-section"><strong>City:</strong> ${applicant.basic_profile.business_location.city_municipality}</div>
            <div class="applicant-section"><strong>Province:</strong> ${applicant.basic_profile.business_location.province}</div>
            <div class="applicant-section"><strong>Region:</strong> ${applicant.basic_profile.business_location.region}</div>
            <div class="applicant-section"><strong>ZIP:</strong> ${applicant.basic_profile.business_location.zip_code}</div>

            <h4>Official Representative</h4>
            <div class="applicant-section"><strong>Name:</strong> ${applicant.official_representative.first_name} ${applicant.official_representative.mid_name} ${applicant.official_representative.surname}</div>
            <div class="applicant-section"><strong>Designation:</strong> ${applicant.official_representative.designation}</div>
            <div class="applicant-section"><strong>DOB:</strong> ${applicant.official_representative.dob}</div>
            <div class="applicant-section"><strong>Contact:</strong> ${applicant.official_representative.contact_no}</div>

            <h4>Alternate Representative</h4>
            <div class="applicant-section"><strong>Name:</strong> ${applicant.alternate_representative.first_name} ${applicant.alternate_representative.mid_name} ${applicant.alternate_representative.surname}</div>
            <div class="applicant-section"><strong>Designation:</strong> ${applicant.alternate_representative.designation}</div>
            <div class="applicant-section"><strong>DOB:</strong> ${applicant.alternate_representative.dob}</div>
            <div class="applicant-section"><strong>Contact:</strong> ${applicant.alternate_representative.contact_no}</div>

            <h4>Organization Membership</h4>
            <div class="applicant-section"><strong>Name:</strong> ${applicant.organization_membership.name_of_organization}</div>
            <div class="applicant-section"><strong>Registration No:</strong> ${applicant.organization_membership.registration_number}</div>
            <div class="applicant-section"><strong>Date of Registration:</strong> ${applicant.organization_membership.date_of_registration}</div>
            <div class="applicant-section"><strong>Company Type:</strong> ${applicant.organization_membership.type_of_company}</div>
            <div class="applicant-section"><strong>Employees:</strong> ${applicant.organization_membership.number_of_employees}</div>
            <div class="applicant-section"><strong>Year Established:</strong> ${applicant.organization_membership.year_established}</div>

            <h4>Internal Tracking</h4>
            <div class="applicant-section"><strong>Recommending Approval:</strong> ${applicant.internal_tracking.recommending_approval || 'N/A'}</div>

            <h4>Timestamps</h4>
            <div class="applicant-section"><strong>Created At:</strong> ${applicant.timestamps.created_at}</div>
            <div class="applicant-section"><strong>Updated At:</strong> ${applicant.timestamps.updated_at}</div>
          `;

          container.appendChild(card);
        });
      } else {
        alert('Failed to fetch applicants.');
      }
    } catch (err) {
      console.error(err);
      alert('An error occurred while fetching applicants.');
    }
  }
</script>

</body>
</html>
